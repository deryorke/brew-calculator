# OPTIONAL. Publishes the site with GitHub Pages and stamps the version automatically on every push.
# Use it when your repository has index.html, sw.js, manifest.webmanifest, icons/ and screenshots/
# at the top level and a tools/ folder next to them:
#   1. Copy this file to .github/workflows/pages.yml in your repository.
#   2. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Not yet run on GitHub by the author: check the first run in the repository's Actions tab.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site and stamp its version
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest _headers icons screenshots _site/
          python3 tools/stamp-version.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
